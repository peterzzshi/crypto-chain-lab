[build]
target = "web/index.html"
dist = "web/dist"
public_url = "/"

[watch]
ignore = ["web/js", "web/pkg", "web/dist"]

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", """
  cargo build --target wasm32-unknown-unknown --release &&
  wasm-bindgen target/wasm32-unknown-unknown/release/encryption_demo.wasm --out-dir web/pkg --target web &&
  cd web && npm run build
"""]
