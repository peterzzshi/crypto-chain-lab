[package]
name = "crypto-chain-lab"
version = "0.1.0"
edition = "2024"
description = "Interactive demos of cryptographic primitives and blockchain construction"
license = "MIT"

[lib]
name = "encryption_demo"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "encryption-demo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
wasm-bindgen = "0.2.126"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
num-bigint = "0.5.1"
num-traits = "0.2"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dev-dependencies]
sha2 = "0.10"
k256 = { version = "0.13", features = ["arithmetic"] }

[profile.release]
opt-level = "s"
lto = true
